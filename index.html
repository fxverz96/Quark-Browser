<!doctype html>
<html><head><meta charset="utf-8"><meta name="color-scheme" content="dark light"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http: https: crx:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'"><title>Quark</title>
<style>
:root{--bg:#1c2130;--bar:#262d3f;--pill:#181d2a;--txt:#e8ebf2;--dim:#9aa3b8;--acc:#2dd4bf;--hov:#323b52;--line:#434d68}
@media (prefers-color-scheme:light){:root{--bg:#dde2ec;--bar:#ffffff;--pill:#eef1f6;--txt:#1d2330;--dim:#5d6678;--acc:#0d9488;--hov:#e4e8f1;--line:#c3cad8}}
*{box-sizing:border-box;margin:0;user-select:none}
body{font:13px "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--txt);overflow:hidden}
#tabs{height:40px;display:flex;align-items:flex-end;padding:0 150px 0 8px;gap:2px;-webkit-app-region:drag}
.tab,#plus{-webkit-app-region:no-drag}
.tab{flex:0 1 auto;max-width:190px;min-width:44px;height:34px;display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;border-radius:10px 10px 0 0;color:var(--dim)}
.tab:hover{background:var(--hov)}
.tab.active{background:var(--bar);color:var(--txt)}
.tab span{flex:0 1 auto;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tab img,.tab i{width:16px;height:16px;flex:none;border-radius:4px}
.dot{background:var(--hov)}
.spin{border:2px solid var(--hov);border-top-color:var(--acc);border-radius:50%;animation:s .7s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.x{width:20px;height:20px;line-height:20px;text-align:center;border-radius:50%;font-size:10px;font-weight:400}
.x{margin-left:2px;flex:none}
.x:hover{background:var(--line)}
#bar{height:48px;background:var(--bar);display:flex;align-items:center;gap:4px;padding:0 10px}
.b{width:32px;height:32px;flex:none;border:0;border-radius:50%;background:none;color:var(--txt);font-size:18px;cursor:pointer;display:grid;place-items:center}
.b:hover{background:var(--hov)}
.b:disabled{opacity:.3;pointer-events:none}
.b svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#plus{align-self:center;width:28px;height:28px;margin-left:4px;color:var(--dim)}
#omni{flex:1;height:36px;display:flex;align-items:center;gap:2px;padding:0 4px 0 16px;background:var(--pill);border:1px solid transparent;border-radius:18px}
#omni:focus-within{border-color:var(--acc)}
#sec{display:flex;align-items:center;margin-right:8px;color:var(--dim);font-size:12px;white-space:nowrap}
#sec:empty{display:none}
#sec svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#sec .bad{color:#f87171;font-weight:600}
#url{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;color:var(--txt);font:inherit;font-size:14px;user-select:text}
#url::placeholder{color:var(--dim)}
#shield{width:auto;padding:0 10px;border-radius:15px;font-size:12px}
#shield.off{opacity:.4}
#star{font-size:17px}
#dl.pulse{color:var(--acc)}
.tab i.pdot{width:8px;height:8px;border-radius:50%}
.av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;color:#fff}
browser-action-list{display:flex;align-items:center;margin-right:2px}
#side{position:fixed;left:0;top:88px;bottom:0;width:52px;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 0}
#sidehide{margin-top:auto}
.sb{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:15px;cursor:pointer}
.sb img{width:22px;height:22px;border-radius:4px}
.sb svg{width:36px;height:36px;display:block}
.sb:hover{filter:brightness(1.15)}
.sb.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--acc)}
.sb.add{background:none;border:1.5px dashed var(--line);color:var(--dim);font-size:20px;font-weight:400}
</style></head>
<body>
<div id="tabs"></div>
<div id="bar">
  <button class="b" id="back" title="Back"></button>
  <button class="b" id="fwd" title="Forward"></button>
  <button class="b" id="rel" title="Reload">↻</button>
  <button class="b" id="home" title="Home"></button>
  <div id="omni">
    <span id="sec"></span>
    <input id="url" placeholder="Search or paste link" spellcheck="false" autocomplete="off">
    <button class="b" id="shield" title="Ad blocker (click to turn on/off)"></button>
    <button class="b" id="star" title="Bookmark this page">☆</button>
  </div>
  <button class="b" id="dl" title="Downloads">⤓</button>
  <browser-action-list alignment="bottom right"></browser-action-list>
  <button class="b" id="ext" title="Extensions"></button>
  <button class="b" id="acc" title="Sign in with Google"></button>
  <button class="b" id="menu" title="Menu">⋮</button>
</div>
<div id="side"></div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const cmd = (c, a) => hub.cmd(c, a);
// only touch the DOM when something changed, so clicks are never lost to a re-render
const setH = (el, html) => { if (el._h !== html) { el.innerHTML = html; el._h = html; } };
const svg = p => `<svg viewBox="0 0 24 24"><path d="${p}"/></svg>`;
$('back').innerHTML = svg('M19 12H5M12 19l-7-7 7-7');
$('fwd').innerHTML = svg('M5 12h14M12 5l7 7-7 7');
$('home').innerHTML = svg('M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10');
$('ext').innerHTML = svg('M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM16.5 13v7M13 16.5h7');
const PERSON = svg('M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z');
const LOGOS = { wa: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#25D366"/><path d="M12 5.2A6.8 6.8 0 0 0 6.1 15.4L5.2 18.8 8.7 17.9A6.8 6.8 0 1 0 12 5.2Z" fill="none" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"/><path d="M9.5 9.3C9.7 11.8 12.2 14.3 14.7 14.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>', tg: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#2AABEE"/><path d="M5.4 11.6 17.8 6.8 15.9 17.3 12.3 14.6 10 16.7 9.7 13.4Z" fill="#fff" stroke="#fff" stroke-width=".6" stroke-linejoin="round"/></svg>' };
let S = { tabs: [] };
const pc = id => ((S.profiles || []).find(p => p.id === id) || {}).color || '#888';

hub.onState(s => { S = s; render(); });
hub.onFocusUrl(() => { $('url').focus(); });

function render() {
  const cur = S.tabs.find(t => t.id === S.active) || {};
  setH($('tabs'), S.tabs.map(t =>
    `<div class="tab${t.id === S.active ? ' active' : ''}" data-id="${t.id}">` +
    (t.profile && t.profile !== 'default' ? `<i class="pdot" style="background:${esc(pc(t.profile))}"></i>` : '') +
    (t.loading ? '<i class="spin"></i>' : t.icon ? `<img src="${esc(t.icon)}">` : '<i class="dot"></i>') +
    `<span>${esc(t.title || 'New Tab')}</span><b class="x" data-x="${t.id}">✕</b></div>`).join('') +
    '<button class="b" id="plus" title="New tab">+</button>');
  setH($('side'), (S.side || []).map(s =>
    `<div class="sb${s.id === S.panel ? ' on' : ''}" data-s="${esc(s.id)}" title="${esc(s.name)}" style="background:${LOGOS[s.id] ? 'none' : s.icon ? 'var(--hov)' : esc(s.color)}">` +
    (LOGOS[s.id] || (s.icon ? `<img src="${esc(s.icon)}">` : esc(s.name[0].toUpperCase()))) + '</div>').join('') +
    '<div class="sb add" id="sadd" title="Add website">+</div>' +
    `<button class="b" id="sidehide" title="${S.panel ? 'Hide' : 'Show'} side panel">${svg(S.panel ? 'M15 18l-6-6 6-6' : 'M9 18l6-6-6-6')}</button>`);
  if (document.activeElement !== $('url')) $('url').value = S.url || '';
  $('back').disabled = !S.canBack;
  $('fwd').disabled = !S.canFwd;
  $('rel').textContent = cur.loading ? '✕' : '↻';
  $('star').textContent = S.starred ? '★' : '☆';
  $('star').style.color = S.starred ? '#facc15' : '';
  $('shield').textContent = '🛡 ' + (S.blocked || 0);
  $('shield').classList.toggle('off', !S.adblock);
  $('dl').classList.toggle('pulse', S.dl > 0);
  const cp = (S.profiles || []).find(p => p.id === S.profile);
  setH($('acc'), cp && cp.id !== 'default' ? `<span class="av" style="background:${esc(cp.color)}">${esc(cp.name[0].toUpperCase())}</span>` : PERSON);
  $('acc').title = cp ? `Profile: ${cp.name}` : 'Profiles and Google sign-in';
  setH($('sec'), S.secure === 'https' ? svg('M7 11V8a5 5 0 0 1 10 0v3M5 11h14v10H5z') : S.secure === 'http' ? '<span class="bad">Not secure</span>' : '');
}

$('tabs').addEventListener('click', e => {
  const x = e.target.closest('[data-x]'), t = e.target.closest('[data-id]');
  if (x) cmd('close', +x.dataset.x);
  else if (t) cmd('switch', +t.dataset.id);
  else if (e.target.id === 'plus') cmd('new');
});
$('tabs').addEventListener('auxclick', e => {
  const t = e.target.closest('[data-id]');
  if (t && e.button === 1) cmd('close', +t.dataset.id);
});
$('side').addEventListener('click', e => {
  const s = e.target.closest('[data-s]');
  if (s) cmd('side', s.dataset.s); else if (e.target.id === 'sadd') cmd('sideAdd');
  else if (e.target.closest('#sidehide')) cmd('sideToggle');
});
$('side').addEventListener('contextmenu', e => {
  const s = e.target.closest('[data-s]');
  if (s) cmd('sideMenu', s.dataset.s);
});
$('back').onclick = () => cmd('back');
$('fwd').onclick = () => cmd('forward');
$('rel').onclick = () => cmd('reload');
$('home').onclick = () => cmd('home');
$('ext').onclick = () => cmd('internal', 'extensions');
$('acc').onclick = e => { const r = e.currentTarget.getBoundingClientRect(); cmd('profile', { x: r.right, y: r.bottom }); };
$('star').onclick = () => cmd('star');
$('shield').onclick = () => cmd('shield');
$('dl').onclick = () => cmd('internal', 'downloads');
$('menu').onclick = e => { const r = e.currentTarget.getBoundingClientRect(); cmd('menu', { x: r.left, y: r.bottom }); };
$('url').addEventListener('focus', e => setTimeout(() => e.target.select()));
$('url').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.value.trim()) { cmd('go', e.target.value); e.target.blur(); }
  if (e.key === 'Escape') { e.target.value = S.url || ''; e.target.blur(); }
});
</script></body></html>
