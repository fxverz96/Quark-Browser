<!doctype html>
<html><head><meta charset="utf-8"><meta name="color-scheme" content="dark light"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http: https: crx:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'"><title>History</title>
<style>
:root{--bg:#232a3b;--side:#1c2130;--hov:#323b52;--txt:#e8ebf2;--dim:#9aa3b8;--line:#323b52;--acc:#2dd4bf}
@media (prefers-color-scheme:light){:root{--bg:#f5f7fb;--side:#e6eaf2;--hov:#dbe1ec;--txt:#1d2330;--dim:#5d6678;--line:#d5dbe7;--acc:#0d9488}}
*{box-sizing:border-box;margin:0}
body{display:flex;min-height:100vh;background:var(--bg);color:var(--txt);font:14px "Segoe UI",system-ui,sans-serif}
nav{width:200px;padding:24px 12px;background:var(--side);display:flex;flex-direction:column;gap:4px}
nav a{padding:10px 14px;border-radius:10px;color:var(--dim);text-decoration:none}
nav a:hover{background:var(--hov)}
nav a.on{background:var(--hov);color:var(--txt)}
main{flex:1;max-width:860px;padding:32px 40px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
h1{font-size:24px;font-weight:600}
h2{font-size:15px;font-weight:600;margin-bottom:10px}
button{padding:7px 14px;border:0;border-radius:8px;background:var(--hov);color:var(--txt);font:inherit;cursor:pointer}
button:hover{filter:brightness(1.12)}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row>div{flex:1;min-width:0}
.row a{color:var(--txt);text-decoration:none;display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.row a:hover{color:var(--acc)}
small,time,.dim{color:var(--dim);font-size:12px}
small{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;margin-top:2px}
progress{width:100%;height:6px;margin-top:8px;accent-color:var(--acc)}
input{width:320px;max-width:60vw;height:38px;padding:0 16px;border-radius:19px;border:1px solid var(--line);background:var(--side);color:var(--txt);font:inherit;outline:0}
input:focus{border-color:var(--acc)}
.row img{width:32px;height:32px;border-radius:6px}
.sec{margin-bottom:32px}
.sec p{margin-bottom:12px;font-size:13px}
.seg{display:inline-flex;gap:6px}
.seg button,.go{padding:9px 20px;border-radius:20px}
.seg button.on,.go{background:var(--acc);color:#06201c;font-weight:600}
</style></head>
<body>
<nav><a href="#history">History</a><a href="#bookmarks">Bookmarks</a><a href="#downloads">Downloads</a><a href="#extensions">Extensions</a><a href="#settings">Settings</a></nav>
<main><header><h1 id="h"></h1><button id="clr">Clear history</button></header><div id="list"></div></main>
<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const mb = b => b > 1e6 ? (b / 1e6).toFixed(1) + ' MB' : Math.round(b / 1e3) + ' KB';
async function show() {
  const v = ['history', 'bookmarks', 'downloads', 'extensions', 'settings'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'history';
  document.title = h.textContent = v[0].toUpperCase() + v.slice(1);
  clr.style.display = v === 'history' ? '' : 'none';
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', a.hash === '#' + v));
  if (v === 'extensions') {
    const xs = await hub.data('extList');
    list.innerHTML = `<div class="sec"><div class="seg"><button class="go" data-x="web">Open Chrome Web Store</button><button data-x="unpacked">Load unpacked…</button></div>
      <p class="dim" style="margin:16px 0 8px">Or install with an extension ID or a Web Store link:</p>
      <div class="seg"><input id="xid" placeholder="Extension ID or link"><button class="go" data-x="install">Install</button></div><p id="xmsg" class="dim" style="margin-top:8px"></p></div>` +
      (xs.map(x => `<div class="row"><img src="crx://extension-icon/${esc(x.id)}/32/2" onerror="this.style.visibility='hidden'">
        <div>${esc(x.name.startsWith('__MSG_') ? x.id : x.name)} <small>v${esc(x.version)}${x.enabled ? '' : ' · disabled'}</small><small>${esc(x.description)}</small></div>
        <button data-x="toggle" data-i="${esc(x.id)}">${x.enabled ? 'Disable' : 'Enable'}</button><button data-x="remove" data-i="${esc(x.id)}">Remove</button></div>`).join('') || '<p class="dim">No extensions installed yet.</p>');
    return;
  }
  if (v === 'settings') {
    const t = await hub.data('getTheme'), dk = await hub.data('getDark'), yt = await hub.data('getYt');
    list.innerHTML = `<div class="sec"><h2>Appearance</h2><div class="seg">` +
      ['dark', 'light', 'system'].map(x => `<button data-t="${x}" class="${x === t ? 'on' : ''}">${x[0].toUpperCase() + x.slice(1)}</button>`).join('') +
      `</div></div><div class="sec"><h2>Dark mode for websites</h2><p class="dim">Turns websites dark when Quark is dark. Close and reopen Quark to apply.</p><div class="seg"><button data-k="1" class="${dk ? 'on' : ''}">On</button><button data-k="0" class="${dk ? '' : 'on'}">Off</button></div></div><div class="sec"><h2>Ad blocking on YouTube</h2><p class="dim">Off by default: blocking scripts can leave YouTube's player black. Turn on only if you want to try it.</p><div class="seg"><button data-yt="1" class="${yt ? 'on' : ''}">On</button><button data-yt="0" class="${yt ? '' : 'on'}">Off</button></div></div><div class="sec"><h2>Google account</h2><p class="dim">Sign in to use Gmail, YouTube and other Google sites in Quark.</p><button class="go" id="gl">Sign in with Gmail</button></div>`;
    const [pfs, prm, ex, ab] = await Promise.all([hub.data('profiles'), hub.data('perms'), hub.data('getExit'), hub.data('about')]);
    list.insertAdjacentHTML('beforeend', `<div class="sec"><h2>Profiles</h2><p class="dim">Each profile keeps its own logins, cookies and history. Use one per Gmail account.</p>` +
      pfs.map(p => `<div class="row"><span style="width:12px;height:12px;border-radius:50%;background:${esc(p.color)}"></span><div>${esc(p.name)}</div>${p.id === 'default' ? '<small>main</small>' : `<button data-pf="${esc(p.id)}">Delete</button>`}</div>`).join('') +
      `<div class="seg" style="margin-top:12px"><button class="go" data-pnew="1">New profile</button></div></div>
      <div class="sec"><h2>Site permissions</h2><p class="dim">Sites you allowed or blocked to use your camera, microphone, location or notifications.</p>` +
      (prm.map(r => `<div class="row"><div>${esc(r.origin.replace(/^https?:\/\//, ''))}<small>${esc(r.perm)} · ${esc(r.value)}</small></div><button data-pr="${esc(r.origin + '|' + r.perm)}">Reset</button></div>`).join('') || '<p class="dim">No saved choices.</p>') +
      (prm.length ? `<div class="seg" style="margin-top:12px"><button data-pr="all">Reset all</button></div>` : '') + `</div>
      <div class="sec"><h2>When closing Quark</h2><p class="dim">Ask what to delete (cookies, history, cache) each time you close.</p><div class="seg"><button data-ex="1" class="${ex.ask ? 'on' : ''}">Ask me</button><button data-ex="0" class="${ex.ask ? '' : 'on'}">Don't ask</button></div></div>
      <div class="sec"><h2>About</h2><p class="dim">Version ${esc(ab.version)} · Built on ${esc(ab.built)} (${ab.age} days ago) · Chromium ${esc(ab.chromium)} · Electron ${esc(ab.electron)}${ab.age >= 60 ? '<br><b style="color:#f59e0b">This version is getting old. Check for updates below.</b>' : ''}</p><div class="seg" style="margin-top:12px"><button class="go" data-up="1">Check for updates</button></div></div>`);
    return;
  }
  const rows = await hub.data(v);
  let html;
  if (v === 'downloads') {
    html = rows.map((d, i) => `<div class="row"><div>${esc(d.name)}
      <small>${d.state === 'progressing' ? mb(d.received) + ' of ' + (d.total ? mb(d.total) : '?') : esc(d.state)}</small>
      ${d.state === 'progressing' && d.total ? `<progress max="${d.total}" value="${d.received}"></progress>` : ''}</div>
      ${d.state === 'completed' ? `<button data-a="dlOpen" data-i="${i}">Open</button>` : ''}
      ${d.state === 'progressing' ? `<button data-a="dlCancel" data-i="${i}">Cancel</button>` : `<button data-a="dlShow" data-i="${i}">Show in folder</button>`}</div>`).join('');
  } else {
    html = rows.map(r => `<div class="row"><div><a href="${esc(r.url)}">${esc(r.title || r.url)}</a><small>${esc(r.url)}</small></div>
      ${v === 'bookmarks' ? `<button data-a="rmBookmark" data-i="${esc(r.url)}">Remove</button>` : `<time>${new Date(r.time).toLocaleString()}</time>`}</div>`).join('');
  }
  list.innerHTML = html || '<p class="dim">Nothing here yet.</p>';
}
list.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'gl') return hub.cmd('google');
  if (b.dataset.up) return hub.cmd('checkUpdates');
  if (b.dataset.pf) { await hub.data('profileDel', b.dataset.pf); return show(); }
  if (b.dataset.pnew) return hub.cmd('pfNew');
  if (b.dataset.pr) { await hub.data('permReset', b.dataset.pr); return show(); }
  if (b.dataset.ex !== undefined) { await hub.data('setExitAsk', b.dataset.ex === '1'); return show(); }
  if (b.dataset.yt !== undefined) { await hub.data('setYt', b.dataset.yt === '1'); return show(); }
  if (b.dataset.k !== undefined) { await hub.data('setDark', b.dataset.k === '1'); return show(); }
  if (b.dataset.x) {
    const x = b.dataset.x;
    if (x === 'web') return window.open('https://chromewebstore.google.com/');
    const r = x === 'unpacked' ? await hub.data('extUnpacked')
      : x === 'install' ? await hub.data('extInstall', xid.value)
      : await hub.data(x === 'toggle' ? 'extToggle' : 'extRemove', b.dataset.i);
    await show();
    if (r && r.error) document.getElementById('xmsg').textContent = r.error;
    return;
  }
  if (b.dataset.t) { await hub.data('setTheme', b.dataset.t); return show(); }
  await hub.data(b.dataset.a, /^\d+$/.test(b.dataset.i) ? +b.dataset.i : b.dataset.i);
  show();
});
clr.onclick = async () => { await hub.data('clearHistory'); show(); };
addEventListener('hashchange', show);
setInterval(() => { if (location.hash === '#downloads') show(); }, 1000);
show();
</script></body></html>
