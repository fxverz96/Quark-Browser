<!doctype html>
<html><head><meta charset="utf-8"><meta name="color-scheme" content="dark light"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'"><title>Download</title>
<style>
:root{--bg:#252b3a;--card:#2e3548;--line:#3a4358;--txt:#e8ebf2;--dim:#9aa3b8;--hov:#323b52;--acc:#2dd4bf}
@media (prefers-color-scheme:light){:root{--bg:#ffffff;--card:#f3f5fa;--line:#dfe4ee;--txt:#1d2330;--dim:#5d6678;--hov:#e6eaf3;--acc:#0d9488}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font:13px "Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;border:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 10px 16px;-webkit-app-region:drag;font-size:14px}
.top button{-webkit-app-region:no-drag;width:28px;height:28px;border:0;border-radius:50%;background:none;color:var(--dim);font-size:14px;cursor:pointer}
.top button:hover{background:var(--hov)}
#body{flex:1;overflow:auto;padding:4px 16px 16px}
h2{font-size:16px;margin:6px 0 8px}
p{margin:6px 0;line-height:1.5}
small,.dim{color:var(--dim);font-size:12px}
ul{margin:8px 0 12px 18px;line-height:1.8}
.vid{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.vid img{width:120px;height:68px;object-fit:cover;border-radius:8px;flex:none}
.vid .t{font-weight:600;line-height:1.35;max-height:54px;overflow:hidden}
.lb{display:block;margin:12px 0 6px;color:var(--dim);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
select{width:100%;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt);padding:0 10px;font:inherit}
.list{display:flex;flex-direction:column;gap:4px;max-height:170px;overflow:auto}
.opt{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--card);cursor:pointer}
.opt:hover{background:var(--hov)}
.opt span{flex:1;font-weight:600}
.opt input{accent-color:var(--acc)}
button{font:inherit;cursor:pointer}
.go,.row button{height:38px;padding:0 20px;border:0;border-radius:19px;background:var(--hov);color:var(--txt)}
.go{background:var(--acc);color:#06201c;font-weight:600}
.go.big{width:100%;margin-top:14px;height:42px}
.go:disabled{opacity:.5}
.row{display:flex;gap:8px;margin-top:10px}
.bar{height:8px;border-radius:4px;background:var(--card);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#22d3ee,#8b5cf6,#f472b6);transition:width .3s}
.err{color:#f87171}
.ok{color:var(--acc);font-weight:600}
#job{margin-top:12px}
</style></head>
<body>
<div class="top"><b>⬇ Download video</b><button id="x" title="Close">✕</button></div>
<div id="body"></div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const URLV = decodeURIComponent(location.hash.slice(1));
const mb = b => b > 1e9 ? (b / 1e9).toFixed(1) + ' GB' : b > 1e6 ? Math.round(b / 1e6) + ' MB' : b ? Math.round(b / 1e3) + ' KB' : '';
const dur = s => { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };
const body = h => { $('body').innerHTML = h; };
let opts = null, jobId = null;

hub.onMsg(m => { if (m.type === 'install' && $('ip')) installProgress(m); if (m.type === 'job' && m.id === jobId && m.state === 'error') showJob(m); });
$('x').onclick = () => hub.cmd('ytClose');
document.addEventListener('keydown', e => { if (e.key === 'Escape') hub.cmd('ytClose'); });

async function boot() {
  body('<p class="dim">Checking…</p>');
  const t = await hub.data('ytTools');
  t.ready ? load() : needTools(t);
}
function needTools(t) {
  const total = t.missing.reduce((a, x) => a + x.mb, 0);
  body(`<h2>One-time setup</h2><p>To download videos, Quark needs a few helper tools (about ${total} MB in total). They are downloaded once from their official sites and checked for safety before use.</p><ul>${t.missing.map(x => `<li>${esc(x.name)} <small>~${x.mb} MB</small></li>`).join('')}</ul><div id="ip"></div><button class="go big" id="inst">Install tools</button>`);
  $('inst').onclick = async () => {
    $('inst').disabled = true;
    const r = await hub.data('ytInstall');
    if (r && r.error) { $('ip').innerHTML = `<p class="err">${esc(r.error)}</p>`; $('inst').disabled = false; } else boot();
  };
}
function installProgress(m) {
  const pct = m.total ? Math.round(m.got / m.total * 100) : 0;
  $('ip').innerHTML = `<p>${esc(m.tool)}</p><div class="bar"><i style="width:${pct}%"></i></div><small>${mb(m.got)} of ${mb(m.total)}</small>`;
}
async function load() {
  body('<p class="dim">Reading video details…</p>');
  const r = await hub.data('ytInfo', URLV);
  if (r.error === 'tools') return boot();
  if (r.error) {
    body(`<p class="err">${esc(r.error)}</p><div class="row"><button id="retry">Try again</button><button id="upd">Update downloader</button></div><p class="dim" id="um"></p>`);
    $('retry').onclick = load;
    $('upd').onclick = async () => { $('um').textContent = 'Updating…'; const u = await hub.data('ytUpdate'); $('um').textContent = (u && u.message) || 'Done'; };
    return;
  }
  opts = r; render();
}
function render() {
  const o = opts, L = o.langs;
  let h = `<div class="vid">${o.thumb ? `<img src="${esc(o.thumb)}" referrerpolicy="no-referrer">` : ''}<div><div class="t">${esc(o.title)}</div><small>${esc(o.uploader)}${o.duration ? ' · ' + dur(o.duration) : ''}</small></div></div>`;
  if (L.length > 1) h += `<span class="lb">Audio language (dubbing)</span><select id="lang">${L.map(l => `<option value="${esc(l.code)}">${esc(l.label)}</option>`).join('')}</select>`;
  if (o.video.length) h += `<span class="lb">Video + audio</span><div class="list">${o.video.map((v, i) => `<label class="opt"><input type="radio" name="q" value="v:${v.height}" data-size="${v.size || 0}" ${i === 0 ? 'checked' : ''}><span>${esc(v.label)}</span><small>${v.size ? '~' + mb(v.size) : ''}</small></label>`).join('')}</div>`;
  h += `<span class="lb">Audio only</span><div class="list"><label class="opt"><input type="radio" name="q" value="a:mp3" data-size="${o.audio.mp3 || 0}" ${o.video.length ? '' : 'checked'}><span>MP3</span><small>${o.audio.mp3 ? '~' + mb(o.audio.mp3) + ' · ' : ''}best quality</small></label><label class="opt"><input type="radio" name="q" value="a:m4a" data-size="${o.audio.m4a || 0}"><span>M4A (AAC)</span><small>${o.audio.m4a ? '~' + mb(o.audio.m4a) + ' · ' : ''}smaller</small></label></div>`;
  h += `<button class="go big" id="dl">Download</button><div id="job"></div>`;
  body(h);
  $('dl').onclick = start;
}
async function start() {
  const picked = document.querySelector('input[name=q]:checked'), [k, v] = picked.value.split(':'), sel = $('lang');
  const lang = sel ? sel.value : (opts.langs[0] ? opts.langs[0].code : '');
  $('dl').disabled = true; $('job').innerHTML = '<p class="dim">Starting…</p>';
  const r = await hub.data('ytStart', { url: URLV, mode: k === 'v' ? 'video' : v, height: k === 'v' ? +v : 0, lang, tagLang: !!sel && sel.selectedIndex > 0, title: opts.title, size: +picked.dataset.size || 0 });
  if (r.error) { $('job').innerHTML = `<p class="err">${esc(r.error)}</p>`; $('dl').disabled = false; return; }
  jobId = r.id;
  $('job').innerHTML = '<p class="ok">✓ Download started</p><small>Watch the progress under the toolbar\'s download button.</small>';
}
function showJob(m) {
  const j = $('job'); if (!j) return;
  if (m.state === 'starting') j.innerHTML = '<p class="dim">Starting…</p>';
  else if (m.state === 'downloading') {
    j.innerHTML = `<div class="bar"><i style="width:${m.pct}%"></i></div><small>${m.pct.toFixed(0)}% ${esc(m.speed || '')} ${m.eta && m.eta !== 'Unknown' ? '· ' + esc(m.eta) + ' left' : ''}</small><div class="row"><button id="cx">Cancel</button></div>`;
    $('cx').onclick = () => hub.data('ytCancel', jobId);
  } else if (m.state === 'done') {
    j.innerHTML = `<p class="ok">✓ Download finished</p><small>${esc(m.file.split(/[\\/]/).pop())}</small><div class="row"><button class="go" id="sf">Show in folder</button><button id="again">Download another</button></div>`;
    $('sf').onclick = () => hub.cmd('ytShow', m.file); $('again').onclick = () => { $('dl').disabled = false; j.innerHTML = ''; };
    $('dl').disabled = false;
  } else if (m.state === 'cancelled') { j.innerHTML = '<p class="dim">Cancelled.</p>'; $('dl').disabled = false; }
  else if (m.state === 'error') { j.innerHTML = `<p class="err">${esc(m.error || 'Download failed')}</p>`; $('dl').disabled = false; }
}
boot();
</script></body></html>
